name: Publish wedding invitation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wedding-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Check JavaScript
        run: npm run check
      - name: Test RSVP handling and public artifact
        run: npm test
      - name: Build public invitation
        run: npm run build
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload invitation
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v5
